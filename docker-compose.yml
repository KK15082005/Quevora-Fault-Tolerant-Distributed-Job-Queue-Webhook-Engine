services:
  postgres:
    image: postgres:16-alpine
    container_name: quevora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quevora}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-quevora_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-quevora}
    ports:
      - "5432:5432"
    volumes:
      - quevora_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - quevora_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quevora} -d ${POSTGRES_DB:-quevora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quevora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quevora_redis_data:/data
    networks:
      - quevora_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quevora_pg_data:
  quevora_redis_data:

networks:
  quevora_net:
    name: quevora_net
    driver: bridge